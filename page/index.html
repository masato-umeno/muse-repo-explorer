<!DOCTYPE html>
<html lang="en" data-lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Repository Explorer</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f5f6f8; --bg3: #eceef2; --fg: #1d2129; --fg2: #5b6270;
  --line: #dfe2e8; --accent: #2f6fde; --warn: #9a5b00;
  --c-com: #6a737d; --c-str: #0a7a3e; --c-num: #b4530f; --c-kw: #8a3fd1;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171c; --bg2: #1c1f26; --bg3: #252932; --fg: #e6e8ec; --fg2: #9aa2b1;
    --line: #2d323c; --accent: #6ea2ff; --warn: #f0b45a;
    --c-com: #7d8695; --c-str: #7fd19b; --c-num: #f2a66b; --c-kw: #c9a2ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans CJK JP", "PingFang SC", "Apple SD Gothic Neo", sans-serif; }
button, select, input { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: max(8px, env(safe-area-inset-top)) 12px 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; min-width: 0; }
h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
select, input[type=search] { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
.meta { color: var(--fg2); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
main { display: flex; min-height: calc(100vh - 120px); }
#side { width: 100%; }
#view { display: none; width: 100%; min-width: 0; }
body.file-open #side { display: none; }
body.file-open #view { display: block; }
@media (min-width: 900px) {
  #side { width: 340px; flex: none; border-right: 1px solid var(--line); height: calc(100vh - var(--hh, 118px)); overflow: auto; position: sticky; top: var(--hh, 118px); }
  #view, body.file-open #view { display: block; }
  body.file-open #side { display: block; }
  #back { display: none !important; }
}
ul.tree { list-style: none; margin: 0; padding: 0; }
.node { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 0;
  padding: 7px 12px; cursor: pointer; overflow-wrap: anywhere; }
.node:hover, .node:focus-visible { background: var(--bg2); outline: none; }
.node.active { background: var(--bg3); }
.caret { width: 1em; flex: none; color: var(--fg2); transition: transform .12s; }
.open > .node .caret { transform: rotate(90deg); }
.icon { flex: none; width: 1.1em; text-align: center; }
.dim { color: var(--fg2); }
.hit small { display: block; color: var(--fg2); font-size: 12px; }
.seg { margin-top: 6px; gap: 6px; }
.seg .btn { padding: 3px 10px; font-size: 13px; }
.match { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 3px 12px 3px 28px; font: 12px/1.5 var(--mono); color: var(--fg2); }
.match:hover, .match:focus-visible { background: var(--bg2); outline: none; }
.match .n { flex: none; min-width: 3ch; text-align: right; }
.match .s { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; color: var(--fg); }
.scope-panel { margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg2);
  max-height: 45vh; overflow: auto; }
.scope-panel h4 { margin: 8px 4px 2px; font-size: 12px; color: var(--fg2); font-weight: 600; }
.scope-panel label { display: flex; gap: 8px; align-items: center; padding: 5px 4px; overflow-wrap: anywhere; }
mark { background: rgba(255, 196, 0, .45); color: inherit; border-radius: 2px; }
.code .l.hl { background: rgba(255, 196, 0, .22); }
.empty { color: var(--fg2); padding: 16px 12px; }
.filebar { position: sticky; top: var(--hh, 118px); z-index: 4; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 12px; }
.btn { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.btn:active { background: var(--bg3); }
.path { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.notice { margin: 16px 12px; padding: 12px; border-radius: 8px; background: var(--bg2); color: var(--warn); }
/* One block per line; the number is a ::before, so wrapped lines keep their number aligned
   and selecting/copying text never includes line numbers. */
.code { font: 12.5px/1.55 var(--mono); overflow-x: auto; }
.code pre { margin: 0; padding: 10px 0; tab-size: 4; counter-reset: ln; min-width: 100%; width: max-content; }
.code .l { display: block; position: relative; padding: 0 12px 0 calc(var(--gw) + 20px); white-space: pre; min-height: 1.55em; }
.code .l::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; top: 0; bottom: 0;
  width: calc(var(--gw) + 8px); padding-right: 8px; text-align: right; color: var(--fg2); background: var(--bg2);
  border-right: 1px solid var(--line); user-select: none; }
.code.wrap { overflow-x: hidden; }
.code.wrap pre { width: auto; }
.code.wrap .l { white-space: pre-wrap; overflow-wrap: anywhere; }
.btn[aria-pressed="true"] { background: var(--bg3); border-color: var(--accent); color: var(--accent); }
.t-c { color: var(--c-com); font-style: italic; } .t-s { color: var(--c-str); }
.t-n { color: var(--c-num); } .t-k { color: var(--c-kw); font-weight: 600; }
.md { padding: 12px 16px 24px; line-height: 1.65; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2 { border-bottom: 1px solid var(--line); padding-bottom: .25em; }
.md h1 { font-size: 1.6em; } .md h2 { font-size: 1.35em; } .md h3 { font-size: 1.15em; } .md h4, .md h5, .md h6 { font-size: 1em; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.4em 0 .6em; line-height: 1.3; }
.md p, .md ul, .md ol, .md blockquote, .md table, .md pre { margin: 0 0 1em; }
.md ul, .md ol { padding-left: 1.6em; }
.md li + li { margin-top: .2em; }
.md li.task { list-style: none; }
.md li.task > input { margin: 0 .4em 0 -1.4em; }
.md a { color: var(--accent); text-decoration: none; } .md a:hover { text-decoration: underline; }
.md code { font: .9em var(--mono); background: var(--bg2); padding: .1em .35em; border-radius: 4px; }
.md pre.md-code { background: var(--bg2); padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.55 var(--mono); }
.md pre.md-code code { background: none; padding: 0; font: inherit; }
.md blockquote { border-left: 4px solid var(--line); padding: 0 1em; color: var(--fg2); }
.md table { display: block; overflow-x: auto; border-collapse: collapse; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 10px; }
.md th { background: var(--bg2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }
.md .md-img { color: var(--fg2); font-size: .9em; }
.mermaid-block { margin: 0 0 1em; padding: 8px; background: var(--bg2); border-radius: 8px; overflow-x: auto; text-align: center; }
.mermaid-block svg { max-width: 100%; height: auto; }
.mermaid-block .notice { margin: 0 0 8px; text-align: left; }
.mermaid-block pre { text-align: left; }
footer { color: var(--fg2); font-size: 12px; padding: 12px; }
h1 { flex: none; }
#gear { padding: 2px 9px; }
.settings h3 { margin: 14px 0 6px; font-size: 13px; color: var(--fg2); font-weight: 600; }
.settings select { width: 100%; }
#hdrRepo { color: var(--fg2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
#hdrToggle { padding: 2px 10px; }
body.hdr-collapsed #hdrBody { display: none; }
body.hdr-collapsed #hdrRepo { display: block; }
.code .l.sel { background: rgba(47, 111, 222, .16); }
.code .l::before { cursor: pointer; }
.askbar { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 8px; align-items: center; padding: 8px 12px;
  padding-bottom: max(8px, env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
.filebar .actions { margin-top: 6px; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
.filebar .actions:empty { display: none; }
.filebar .actions .btn { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .35); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-body { width: 100%; max-width: 640px; background: var(--bg); border-radius: 14px 14px 0 0; padding: 14px 14px max(14px, env(safe-area-inset-bottom)); }
.sheet textarea { width: 100%; margin: 10px 0 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; color: inherit; resize: vertical; }
.sheet label { gap: 8px; margin: 4px 0; }
.ask-range { gap: 6px; margin: 4px 0; }
.ask-range input { width: 5.5em; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; color: inherit; font: inherit; }
.ask-preview.hint { font-family: inherit; font-size: 13px; color: var(--fg2); background: none; padding: 4px 0; }
.ask-preview { max-height: 28vh; overflow: auto; margin: 6px 0; padding: 8px 10px; background: var(--bg2); border-radius: 8px;
  font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; background: var(--fg); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 data-i18n="title">Repository Explorer</h1>
    <span id="hdrRepo" class="grow"></span>
    <button class="btn" id="gear" aria-haspopup="dialog">⚙</button>
    <button class="btn" id="hdrToggle" aria-expanded="true" aria-controls="hdrBody"></button>
  </div>
  <div id="hdrBody">
  <div class="row" style="margin-top:8px">
    <select id="repo" class="grow" aria-label="Repository"></select>
  </div>
  <div class="meta" id="repoMeta"></div>
  <div class="row" style="margin-top:8px">
    <input id="q" type="search" class="grow" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="row seg" id="searchOpts">
    <button class="btn" data-mode="name"></button><button class="btn" data-mode="text"></button>
    <span class="grow"></span>
    <button class="btn" id="scope" aria-expanded="false" aria-controls="scopePanel"></button>
  </div>
  <div id="scopePanel" class="scope-panel" hidden>
    <div class="row seg" style="margin-top:0">
      <button class="btn" data-scope="current"></button><button class="btn" data-scope="all"></button>
      <span class="grow"></span><button class="btn" data-scope="done"></button>
    </div>
    <div id="scopeList"></div>
  </div>
  </div>
</header>
<div id="settingsSheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-body settings">
    <div class="row"><strong class="grow" id="setTitle"></strong><button class="btn" id="setClose">×</button></div>
    <h3 id="setLangLabel"></h3>
    <select id="lang">
      <option value="en">English</option><option value="ja">日本語</option>
      <option value="zh-CN">简体中文</option><option value="ko">한국어</option>
    </select>
    <h3 id="setViewLabel"></h3>
    <label class="row"><input type="checkbox" id="setWrap"> <span id="setWrapLabel"></span></label>
  </div>
</div>
<div id="askSheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-body">
    <div class="row"><strong class="grow" id="askTitle"></strong><button class="btn" id="askClose">×</button></div>
    <div class="meta" id="askTarget"></div>
    <textarea id="askQ" rows="3"></textarea>
    <div class="row ask-range">
      <span id="askRangeLabel"></span>
      <input id="askFrom" type="number" inputmode="numeric" min="1" aria-label="from"> –
      <input id="askTo" type="number" inputmode="numeric" min="1" aria-label="to">
    </div>
    <pre id="askPreview" class="ask-preview" hidden></pre>
    <div class="meta" id="askNote"></div>
    <div class="row" style="margin-top:8px"><span class="grow"></span>
      <button class="btn" id="askCopy"></button><button class="btn primary" id="askShare"></button></div>
  </div>
</div>
<main>
  <nav id="side"><div class="empty" id="status">…</div></nav>
  <section id="view"></section>
</main>
<footer id="foot"></footer>

  a = Math.min(Math.max(a, 1), n); b = Math.min(Math.max(b, 1), n);
  return a <= b ? { a: a, b: b } : { a: b, b: a };
}
// Shows what will be referred to, so the range can be checked before sending.
function updateAsk() {
  var lines = askLines(), sel = askRange(), pv = $('askPreview');
  askCtx.sel = sel;
  $('askTarget').textContent = askCtx.repo.id + ' · ' + askCtx.f.path + (sel ? ' · ' + t('selected')(sel.a, sel.b) : '');
  $('askShare').disabled = $('askCopy').disabled = !sel;
  if (!sel) { pv.textContent = t('askNeed'); pv.hidden = false; pv.classList.add('hint'); return; }
  pv.classList.remove('hint');
  var MAX = 30, end = Math.min(sel.b, sel.a + MAX - 1), w = String(end).length, out = [];
  for (var i = sel.a; i <= end; i++) out.push(('        ' + i).slice(-w) + '  ' + lines[i - 1]);
  if (end < sel.b) out.push(t('more')(sel.b - end));
  pv.textContent = out.join('\n');
  pv.hidden = false;
}
function openAsk(repo, f, content, sel) {
  askCtx = { repo: repo, f: f, content: content, sel: sel };
  $('askTitle').textContent = t('askTitle');
  $('askQ').placeholder = t('askQ');
  $('askRangeLabel').textContent = t('askRange');
  $('askFrom').max = $('askTo').max = String(askLines().length);
  $('askFrom').placeholder = '1';
  $('askTo').placeholder = String(askLines().length);
  $('askFrom').value = sel ? sel.a : '';
  $('askTo').value = sel ? sel.b : '';
  $('askNote').textContent = t('askNote');
  updateAsk();
  $('askCopy').textContent = t('copy');
  $('askShare').textContent = t('askShare');
  $('askShare').hidden = !navigator.share;
  $('askSheet').hidden = false;
  setTimeout(function () { $('askQ').focus(); }, 50);
}
function closeAsk() { $('askSheet').hidden = true; askCtx = null; }
function currentAskText() { // only reachable with a range: the buttons are disabled otherwise
  return askText(askCtx.repo, askCtx.f, askRange(), $('askQ').value.trim());
}
function wrapOn() { return store('rx.wrap') !== '0'; }
function copyText(s) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(s).catch(function () { return fallbackCopy(s); });
  }
  return fallbackCopy(s);
}
function fallbackCopy(s) {
  var ta = el('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}

/* ---------- routing: #<repo>:<path> (phone back button works) ---------- */
function go(repoId, path) {
  var h = '#' + encodeURIComponent(repoId) + (path ? ':' + encodeURIComponent(path) : '');
  if (location.hash === h) route(); else location.hash = h;
}
function route() {
  var h = location.hash.slice(1), i = h.indexOf(':');
  var repoId = decodeURIComponent(i < 0 ? h : h.slice(0, i));
  var path = i < 0 ? null : decodeURIComponent(h.slice(i + 1));
  if (!byId[repoId]) repoId = current || store('rx.repo') || (DATA.repos[0] && DATA.repos[0].id);
  if (!byId[repoId]) repoId = DATA.repos[0] && DATA.repos[0].id;
  if (repoId !== current || !$('side').querySelector('ul')) {
    current = repoId; store('rx.repo', repoId || '');
    $('repo').value = repoId || '';
    renderMeta();
    $('hdrRepo').textContent = repoId || '';
    if (!$('q').value) renderTree();
    else if (scope.kind === 'current') runSearch();
    prefetch(byId[repoId]);
  }
  renderFile(path);
  if (path && !$('q').value) {
    var btns = $('side').querySelectorAll('.node[data-path]');
    for (var k = 0; k < btns.length; k++) if (btns[k].dataset.path === path) { setActive(btns[k]); break; }
  }
}

/* ---------- settings ---------- */
function openSettings() {
  $('setTitle').textContent = t('settings');
  $('setLangLabel').textContent = t('language');
  $('lang').value = lang;
  $('setViewLabel').textContent = t('view');
  $('setWrapLabel').textContent = t('wrapDefault');
  $('setWrap').checked = wrapOn();
  $('settingsSheet').hidden = false;
}
function closeSettings() { $('settingsSheet').hidden = true; }

/* ---------- boot ---------- */
$('gear').addEventListener('click', openSettings);
$('setClose').addEventListener('click', closeSettings);
$('settingsSheet').addEventListener('click', function (e) { if (e.target === this) closeSettings(); });
$('lang').addEventListener('change', function () {
  lang = this.value; store('rx.lang', lang);
  applyStaticText(); setHeader(headerCollapsed()); openSettings();
  if (!DATA) return;
  renderMeta(); route();
  if ($('q').value.trim()) runSearch();
  if (!$('scopePanel').hidden) renderScopeList();
});
$('setWrap').addEventListener('change', function () {
  store('rx.wrap', this.checked ? '1' : '0');
  if (DATA) route();
});

document.body.classList.toggle('hdr-collapsed', store('rx.hdr') === '0');
applyStaticText();
setHeader(headerCollapsed());
$('status').textContent = t('loading');
loadData().then(function (data) {
  DATA = data || { repos: [] };
  DATA.repos = DATA.repos || [];
  DATA.repos.forEach(function (r) { r.files = r.files || []; byId[r.id] = r; });
  applyStaticText();
  if (!DATA.repos.length) { $('side').textContent = ''; $('side').appendChild(el('div', 'empty', t('noRepos'))); return; }
  renderRepoSelect();
  $('repo').addEventListener('change', function () { $('q').value = ''; go(this.value, null); });
  var timer;
  $('q').addEventListener('input', function () {
    var q = this.value.trim();
    // On phones the tree/results and the file view share one pane: show the results.
    if (document.body.classList.contains('file-open') && window.matchMedia('(max-width: 899px)').matches) {
      go(current, null);
    }
    clearTimeout(timer);
    timer = setTimeout(runSearch, searchMode === 'text' ? 350 : 150);
  });
  $('searchOpts').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.id === 'scope') {
      var panel = $('scopePanel'), open = panel.hidden;
      if (open) renderScopeList();
      panel.hidden = !open;
      b.setAttribute('aria-expanded', String(open));
      updateSearchOpts();
      return;
    }
    searchMode = b.getAttribute('data-mode'); store('rx.smode', searchMode);
    updateSearchOpts();
    if (document.body.classList.contains('file-open') && window.matchMedia('(max-width: 899px)').matches) go(current, null);
    runSearch();
  });
  $('hdrToggle').addEventListener('click', function () { setHeader(!headerCollapsed()); });
  $('askClose').addEventListener('click', closeAsk);
  $('askFrom').addEventListener('input', updateAsk);
  $('askTo').addEventListener('input', updateAsk);

  $('askSheet').addEventListener('click', function (e) { if (e.target === this) closeAsk(); });
  $('askCopy').addEventListener('click', function () {
    var text = currentAskText();
    copyText(text).then(function () { closeAsk(); toast(t('askCopied')); });
  });
  $('askShare').addEventListener('click', function () {
    var text = currentAskText();
    navigator.share({ text: text }).then(closeAsk).catch(function (err) {
      if (err && err.name === 'AbortError') return; // the user closed the share sheet
      copyText(text).then(function () { closeAsk(); toast(t('askCopied')); });
    });
  });
  $('scopePanel').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-scope]') : null;
    if (!b) return;
    var kind = b.getAttribute('data-scope');
    if (kind === 'done') {
      $('scopePanel').hidden = true; $('scope').setAttribute('aria-expanded', 'false'); updateSearchOpts(); return;
    }
    setScope(kind); renderScopeList();
  });
  $('scopePanel').addEventListener('change', function () {
    var ids = [].map.call($('scopeList').querySelectorAll('input:checked'), function (c) { return c.value; });
    if (!ids.length) setScope('current');
    else if (ids.length === DATA.repos.length) setScope('all');
    else if (ids.length === 1 && ids[0] === current) setScope('current');
    else setScope('pick', ids);
  });
  window.addEventListener('resize', updateSearchOpts);
  window.addEventListener('hashchange', route);
  $('view').addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[data-path], a[data-anchor]') : null;
    if (!a) return;
    e.preventDefault();
    var p = a.getAttribute('data-path'), anchor = a.getAttribute('data-anchor');
    if (p === null) { scrollToAnchor(anchor); return; }
    var has = function (x) { return !!repoFile(byId[current], x); };
    var dirReadme = (p ? p.replace(/\/$/, '') + '/' : '') + 'README.md';
    var target = has(p) ? p : has(dirReadme) ? dirReadme : null;
    if (target) { pendingAnchor = anchor; go(current, target); }
  });
  route();
}).catch(function (e) {
  $('status').textContent = e && e.message === 'unsupported' ? t('unsupported') : t('loadError');
});
})();
</script>
</body>
