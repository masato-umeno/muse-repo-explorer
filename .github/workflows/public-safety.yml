name: public-safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Public safety check
        run: python3 scripts/check_public_safety.py
      - name: Script syntax
        run: |
          python3 -m py_compile tools/*.py scripts/*.py
          for f in tools/*.sh scripts/*.sh; do sh -n "$f"; done
